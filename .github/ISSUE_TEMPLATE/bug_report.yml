name: Bug report
description: Report broken or unexpected application behavior.
title: "[Bug]: "
labels: ["type:bug"]
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the page state, expected behavior, and actual behavior.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
